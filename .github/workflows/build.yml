name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the data and build the site
        run: python3 build.py
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
